<!DOCTYPE html>
<html>
<head>
    <title>Form URL</title>
</head>
<body>

    <h2>Form URL</h2>

    <form>
        <fieldset>
            <legend>URL</legend>
            <table>
                <tr>
                    <td>URL:</td>
                    <td><input type="url" name="url" placeholder="Masukkan URL..."></td>
                </tr>
                <tr>
                    <td>Tanggal:</td>
                    <td><input type="date" name="tanggal"></td>
                </tr>
                <tr>
                    <td>Waktu:</td>
                    <td><input type="time" name="waktu"></td>
                </tr>
                <tr>
                    <td>Jumlah:</td>
                    <td><input type="number" name="jumlah"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="submit" value="Send">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>

</body>
</html>
